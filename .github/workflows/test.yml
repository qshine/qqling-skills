name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install openpyxl==3.1.5
      - name: Compile scripts
        run: |
          python -m py_compile ql-skill-usage-auditor/scripts/skill_usage_auditor.py
          python -m py_compile ql-skill-usage-auditor/scripts/validate_skill.py
          python -m py_compile ql-schedule-night-shifts/scripts/schedule_night_shifts.py
          python -m py_compile ql-harness-doctor/scripts/*.py
      - name: Validate Skill structure
        run: |
          python ql-skill-usage-auditor/scripts/validate_skill.py
          python ql-skill-usage-auditor/scripts/validate_skill.py ql-schedule-night-shifts
          python ql-skill-usage-auditor/scripts/validate_skill.py ql-harness-doctor
          python ql-harness-doctor/scripts/validate_catalog.py
      - name: Run unit tests
        run: |
          python -m unittest discover -s ql-skill-usage-auditor/tests -p 'test_*.py' -v
          python -m unittest discover -s ql-schedule-night-shifts/tests -p 'test_*.py' -v
          python -B -m unittest discover -s ql-harness-doctor/tests -p 'test_*.py' -v
