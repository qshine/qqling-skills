name: test

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -r xhs-cover-director/requirements.txt
          python -m pip install openpyxl==3.1.5
      - name: Compile scripts
        run: |
          python -m py_compile skill-usage-auditor/scripts/skill_usage_auditor.py
          python -m py_compile skill-usage-auditor/scripts/validate_skill.py
          python -m py_compile xhs-cover-director/scripts/compose_cover.py
          python -m py_compile schedule-night-shifts/scripts/schedule_night_shifts.py
      - name: Validate Skill structure
        run: |
          python skill-usage-auditor/scripts/validate_skill.py
          python skill-usage-auditor/scripts/validate_skill.py xhs-cover-director
          python skill-usage-auditor/scripts/validate_skill.py schedule-night-shifts
      - name: Run unit tests
        run: |
          python -m unittest discover -s xhs-cover-director/tests -p 'test_*.py' -v
          python -m unittest discover -s skill-usage-auditor/tests -p 'test_*.py' -v
          python -m unittest discover -s schedule-night-shifts/tests -p 'test_*.py' -v
